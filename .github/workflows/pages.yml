# app/ を GitHub Pages へ配る。
# これまで配信は一度きりの手動だったので、push で必ず配れる形にした。
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: sw.js が最新か（回し忘れると電波なしで古い版が出る）
        run: |
          node tools/build_sw.mjs
          git diff --exit-code -- app/sw.js
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v5
